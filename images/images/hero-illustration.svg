<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a graduate rising with an idea, symbolizing turning education into entrepreneurship">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16295C"/>
      <stop offset="100%" stop-color="#0B1F4D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DFA6"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="460" rx="26" fill="url(#skyGrad)"/>

  <circle cx="330" cy="70" r="60" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="60" cy="400" r="90" fill="none" stroke="#D4AF37" stroke-opacity="0.2" stroke-width="2"/>

  <!-- growth bars -->
  <g transform="translate(70,300)">
    <rect x="0" y="60" width="34" height="60" rx="6" fill="#1F3A78"/>
    <rect x="46" y="35" width="34" height="85" rx="6" fill="#28468C"/>
    <rect x="92" y="5" width="34" height="115" rx="6" fill="url(#goldGrad)"/>
  </g>

  <!-- upward arrow -->
  <path d="M170 230 L235 150 L235 185 L280 130" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M255 122 L282 130 L272 158" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- graduation cap -->
  <g transform="translate(150,60)">
    <polygon points="60,0 120,26 60,52 0,26" fill="#EDEFF6"/>
    <polygon points="60,10 100,26 60,42 20,26" fill="#0B1F4D"/>
    <rect x="55" y="26" width="10" height="34" rx="3" fill="#D4AF37"/>
    <circle cx="60" cy="66" r="6" fill="#D4AF37"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(255,230)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <path d="M-10 24 L10 24" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M-6 32 L6 32" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 -8 L0 4 L8 -10" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
